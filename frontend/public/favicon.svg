<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <rect width="40" height="40" rx="8" fill="#0d3b3b" />
  
  <!-- Subtle circular border -->
  <circle cx="20" cy="20" r="14.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 1.5" opacity="0.6" />
  <circle cx="20" cy="20" r="14.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

  <!-- Mangrove tree / leaf icon scaled inside favicon background -->
  <g transform="translate(4, 4) scale(0.8)">
    <!-- Mangrove center leaf -->
    <path d="M20,8 C20,8 15.5,13.5 15.5,18.5 C15.5,22.5 18.5,24 20,25 C21.5,24 24.5,22.5 24.5,18.5 C24.5,13.5 20,8 20,8 Z" fill="#ffffff" />
    
    <!-- Left leaf -->
    <path d="M20,18 C17,17.5 11,20 11,24.5 C11,28 15,28.5 18,26.5 C18.5,26 19.5,22 20,18 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Right leaf -->
    <path d="M20,18 C23,17.5 29,20 29,24.5 C29,28 25,28.5 22,26.5 C21.5,26 20.5,22 20,18 Z" fill="#ffffff" opacity="0.9" />

    <!-- Mangrove prop roots -->
    <path d="M20,25 C20,27.5 17.5,31 15,33" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <path d="M20,25 C20,27.5 22.5,31 25,33" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <path d="M20,25 L20,33" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Carbon chain / molecule dot -->
    <path d="M30,10 L33.5,13.5 M33.5,13.5 L31.5,17" fill="none" stroke="#80cbc4" stroke-width="1" />
    <circle cx="30" cy="10" r="2.2" fill="#80cbc4" />
    <circle cx="33.5" cy="13.5" r="1.8" fill="#80cbc4" />
    <circle cx="31.5" cy="17" r="1.5" fill="#80cbc4" />
  </g>
</svg>